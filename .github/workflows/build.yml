name: Build executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find and build project
        run: |
          # Recherche automatique du fichier .csproj dans le dépôt et publication
          $csproj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          if ($csproj) {
            Write-Host "Projet trouvé : $($csproj.FullName)"
            dotnet publish $csproj.FullName -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish
          } else {
            Write-Error "Aucun fichier .csproj trouvé dans le dépôt !"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer
          path: ./publish/
